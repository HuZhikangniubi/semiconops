services:
  db:
    image: pgvector/pgvector:0.8.5-pg17-bookworm
    container_name: semiconops-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-semiconops}
      POSTGRES_USER: ${POSTGRES_USER:-semiconops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    ports:
      - "5432:5432"
    volumes:
      - semiconops_pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-semiconops} -d ${POSTGRES_DB:-semiconops}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: semiconops-api
    restart: unless-stopped
    env_file: [.env]
    environment:
      SEMICONOPS_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-semiconops}:${POSTGRES_PASSWORD:-change_me}@db:5432/${POSTGRES_DB:-semiconops}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  semiconops_pgdata:
