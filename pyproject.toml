[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "semiconops"
version = "0.0.1"
description = "Semiconductor yield risk analysis and evidence-grounded investigation copilot."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.16,<2",
  "pgvector>=0.4,<1",
  "structlog>=25.4,<26",
  "numpy>=2.2,<2.5",
  "pandas>=2.3,<3",
  "scikit-learn>=1.7,<2",
  "scipy>=1.15,<2",
  "pyarrow>=21,<22",
  "joblib>=1.5,<2",
  "httpx>=0.28,<1",
  "typer>=0.16,<1",
  "python-multipart>=0.0.20,<1",
]

[project.optional-dependencies]
ml = [
  "xgboost>=3.0,<4",
  "shap>=0.48,<1",
  "numba>=0.66,<0.67",
  "llvmlite>=0.48,<0.49",
]
rag = ["pypdf>=5.8,<6", "beautifulsoup4>=4.13,<5", "lxml>=6,<7", "rank-bm25>=0.2.2,<1"]
ui = ["streamlit>=1.47,<2", "plotly>=6.2,<7"]

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
  "mypy>=1.17,<2",
  "bandit>=1.8,<2",
  "pip-audit>=2.9,<3",
  "pre-commit>=4.2,<5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/semiconops"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["semiconops"]
mypy_path = "src"
